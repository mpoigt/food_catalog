repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
    - id: ruff-check
    - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
    -   id: mypy
        name: mypy (python)
        args: [src, --config-file=mypy.ini]
        additional_dependencies: [pytest==8.3.4]
        pass_filenames: false